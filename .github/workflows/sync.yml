name: Sync availability

on:
  schedule:
    - cron: "17 * * * *"      # hourly, at 17 minutes past
  workflow_dispatch:           # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: sync-availability
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull calendar and write availability.json
        env:
          ICAL_URLS: ${{ secrets.ICAL_URLS }}
        run: node sync-availability.mjs
      - name: Commit if changed
        run: |
          git config user.name "availability-bot"
          git config user.email "actions@users.noreply.github.com"
          git add availability.json
          git commit -m "Sync availability" || echo "nothing to commit"
          git push
